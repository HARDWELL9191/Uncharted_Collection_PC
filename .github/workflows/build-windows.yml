# shaderwait fork: builds the player zip (Uncharted Launcher.exe + ucndc.exe + DLLs) on GitHub's
# Windows runners, the same steps as packaging/windows/empacotar.bat. Download it from the run's
# Artifacts, or push a tag v* to get it attached to a Release.
name: build-windows
on:
  push:
    branches: [shaderwait]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git patch
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p python:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p fmt:p boost:p robin-map:p xxhash:p ffmpeg:p zydis:p
            spirv-tools:p spirv-headers:p spirv-cross:p
      - name: Build and package
        shell: msys2 {0}
        run: |
          export WINPYTHON="$(cygpath -u "$pythonLocation")/python.exe"
          # msys2-env.sh defaults to C:/msys64, which GitHub's runners also ship (an older MSYS2).
          # Mixing its usr/bin with this one's runtime breaks plain tools like cp: point it here.
          export MSYS2_ROOT="$(cygpath -u "$(cygpath -m /)")"
          echo "MSYS2_ROOT=$MSYS2_ROOT"
          echo "ninja: $(command -v ninja)  clang: $(command -v clang)  python: $WINPYTHON"
          bash -x build.sh || { echo '--- out/gpu-build.log (tail) ---'; tail -80 out/gpu-build.log 2>/dev/null; exit 1; }
          bash -x packaging/windows/package_uc.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: out/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: ucndc_pc-windows
          path: dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
