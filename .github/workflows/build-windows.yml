# shaderwait fork: builds the player zip (Uncharted Launcher.exe + ucndc.exe + DLLs) on GitHub's
# Windows runners, the same steps as packaging/windows/empacotar.bat. Download it from the run's
# Artifacts, or push a tag v* to get it attached to a Release.
name: build-windows
on:
  push:
    branches: [shaderwait]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git patch
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p python:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p fmt:p boost:p robin-map:p xxhash:p ffmpeg:p zydis:p
            spirv-tools:p spirv-headers:p spirv-cross:p
      - name: Build and package
        shell: msys2 {0}
        run: |
          export WINPYTHON="$(cygpath -u "$pythonLocation")/python.exe"
          bash build.sh
          bash packaging/windows/package_uc.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ucndc_pc-windows
          path: dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
